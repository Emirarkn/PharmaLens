[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfect-pharmacies-observer"
version = "0.1.0"
description = "Explainable, as-of-safe OTC opportunity ranking for pharmacies (synthetic-data demo)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyyaml>=6",
    "jsonschema>=4.20",
    "typer>=0.12",
    "lightgbm>=4.3",
    "shap>=0.45",
    "scikit-learn>=1.4",
    "xlsxwriter>=3.1",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ppi = "pharmacy_potential.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: end-to-end runs on a small synthetic universe"]
