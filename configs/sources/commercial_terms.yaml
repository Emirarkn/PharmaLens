# Source mapping: monthly campaign / MF / discount terms. Known-at = announcement date.
dataset: commercial_terms
source_name: commercial
stage_table: stg_commercial_terms
file: {format: csv, delimiter: ",", decimal: ".", thousands: null, encoding: utf-8, month_formats: ["%Y-%m"], date_format: "%Y-%m-%d"}
columns:
  month:             {source: Ay, type: month, required: true}
  barcode:           {source: Barkod, type: barcode, required: true}
  campaign_id:       {source: KampanyaID, type: code, required: true}
  eligibility_scope: {source: Kapsam, type: code, required: true}
  mf_definition:     {source: MFTanimi, type: string, required: false}
  discount_rate:     {source: IskontoOrani, type: decimal, required: false}
  price_basis:       {source: FiyatBazi, type: code, required: false}
  available_at:      {source: DuyuruTarihi, type: date, required: false}
key: [month, barcode, campaign_id, eligibility_scope]
subgrain: []
measures: []
nonnegative: []
fk: {barcode: product}
time_column: month
available_at_column: available_at
