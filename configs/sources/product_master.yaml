# Source mapping: product master. Form/strength/pack must be confirmed by the product team.
dataset: product_master
source_name: master
stage_table: stg_product_master
file: {format: csv, delimiter: ",", decimal: ".", thousands: null, encoding: utf-8, month_formats: ["%Y-%m"], date_format: "%Y-%m-%d"}
columns:
  barcode:                {source: Barkod, type: barcode, required: true}
  brand:                  {source: Marka, type: string, required: true}
  form:                   {source: Form, type: code, required: false}
  strength:               {source: Guc, type: string, required: false}
  pack_size:              {source: PaketAdet, type: int, required: false}
  unit_definition:        {source: BirimTanimi, type: string, required: false}
  valid_from:             {source: BaslangicTarihi, type: date, required: false}
  valid_to:               {source: BitisTarihi, type: date, required: false}
  list_price_vat_inc_try: {source: ListeFiyatiKDVDahil, type: decimal, required: false}
key: [barcode]
subgrain: []
measures: []
nonnegative: [pack_size]
fk: {}
time_column: null
available_at_column: null
