# Source mapping: supplier depot <-> pharmacy relationship (several suppliers possible; volume share unknown).
dataset: pharmacy_depot
source_name: master
stage_table: stg_pharmacy_depot
file: {format: csv, delimiter: ";", decimal: ",", thousands: null, encoding: utf-8, month_formats: ["%Y-%m"], date_format: "%d.%m.%Y"}
columns:
  gln:        {source: GLN, type: gln, required: true}
  depot_code: {source: DepoKodu, type: code, required: true}
  valid_from: {source: BaslangicTarihi, type: date, required: false}
  valid_to:   {source: BitisTarihi, type: date, required: false}
key: [gln, depot_code]
subgrain: []
measures: []
nonnegative: []
fk: {gln: pharmacy, depot_code: depot}
time_column: null
available_at_column: null
