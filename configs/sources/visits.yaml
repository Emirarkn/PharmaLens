# Source mapping: field visits. Staff names are not needed and must not be mapped.
dataset: visits
source_name: crm
stage_table: stg_visits
file: {format: csv, delimiter: ",", decimal: ".", thousands: null, encoding: utf-8, month_formats: ["%Y-%m"], date_format: "%Y-%m-%d"}
columns:
  visit_id:     {source: ZiyaretID, type: code, required: true}
  gln:          {source: GLN, type: gln, required: true}
  occurred_at:  {source: ZiyaretTarihi, type: date, required: true}
  available_at: {source: KayitTarihi, type: date, required: false}
  channel:      {source: Kanal, type: code, required: false}
  outcome:      {source: Sonuc, type: code, required: false}
key: [visit_id]
subgrain: []
measures: []
nonnegative: []
fk: {gln: pharmacy}
time_column: occurred_at
available_at_column: available_at
