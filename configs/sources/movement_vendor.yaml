# Source mapping: VENDOR panel measurement of the same depot->pharmacy flow (alternative observation).
dataset: movement_vendor
source_name: vendor
stage_table: stg_movement_vendor
file: {format: csv, delimiter: ",", decimal: ".", thousands: null, encoding: utf-8, month_formats: ["%Y%m", "%Y-%m"], date_format: "%Y-%m-%d"}
columns:
  gln:         {source: PharmacyGLN, type: gln, required: true}
  month:       {source: Month, type: month, required: true}
  barcode:     {source: EAN, type: barcode, required: true}
  units_total: {source: Units, type: int, required: true}
key: [gln, month, barcode]
subgrain: []
measures: [units_total]
nonnegative: []
fk: {gln: pharmacy, barcode: product}
time_column: month
available_at_column: null
