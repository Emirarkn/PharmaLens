# DRAFT - G1 not accepted. Data owner approval required before real-data use.
# v002 = v001 + zero evidence separated from batch quality. v001 stays on disk, unchanged.
policy_version: selection_policy_v002
approval_status: draft_unapproved

primary_source: mutabakat
fallback_source: vendor

# A primary cell is eligible only when every depot linked to the GLN in that month
# is declared COMPLETE for mutabakat (as known at the cutoff).
primary_eligibility: coverage_complete_all_linked_depots

# Absence of a record is zero only where the coverage contract proves complete reporting
# AND no rejected row could belong to that cell.
primary_absence_is_zero_when_complete: true
fallback_absence_is_zero: false

# How a rejected row limits the "no record -> zero" inference:
#   z2_narrowed  - DEFAULT. The set is narrowed by the fields the row still shows; recorded cells stay observed.
#   strict_k7_v1 - sensitivity only: the superseded rule (whole depot-month leaves the primary source).
absence_zero_evidence: z2_narrowed

# Batch quality acceptance. Used ONLY for the quality label of a batch; it never changes
# a cell's observation status. Draft values, frozen by the owner in G1.
batch_quality: {tau_rel: 0.005, tau_abs: 5}

# Owner decisions, closed by default.
uncertainty_bounds_as_model_input: false    # Z5: bounds are reported (coverage_bounds.csv), never a model input
gln_repair_leading_zero: false              # Z6: needs owner approval

# Same-key repeats inside one source: identical rows are deduplicated, conflicting rows quarantined.
within_source_duplicates: {identical: deduplicate, conflicting: quarantine}

# Large disagreement between sources is flagged and reported, never averaged or summed.
conflict_threshold: {abs_units: 3, rel: 0.30}

# Alternative modes for the source-fixed sensitivity report only.
modes: [default, primary_only, fallback_only]
