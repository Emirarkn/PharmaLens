# Pilot run configuration. Paths are relative to the project root (parent of configs/).
project: pharmacy_potential
config_version: pilot_v001

paths:
  data_root: ./data   # may point to an approved secure location
  reports_root: ./reports
  outputs_root: ./outputs
  artifacts_root: ./artifacts
  warehouse_file: warehouse.duckdb   # relative to data_root

display_timezone: Europe/Istanbul
seed: 20261026
num_threads: 4

brand: DemoBrand
pilot_cities: ["34", "06", "21", "47", "61", "44"]   # official plate codes

history_start_month: "2021-01"
horizon_months: 3

# Scoring origin and the availability cutoff used for the production score run.
score_origin_month: "2026-09"
score_cutoff_utc: "2026-10-25T00:00:00Z"

# Backtest cutoff = end of origin month + this many days (must cover the conservative
# retrospective lag of historical backfills; see contracts/observation_status_v001.md).
backtest_cutoff_lag_days: 50

selection_policy: configs/selection_policy_v002.yaml
thresholds: configs/thresholds_v001.yaml
alt_thresholds: configs/thresholds_v002.yaml   # draft alternative label: validation origins only, never a gate input
scenario: configs/scenarios/demo_brand_v001.yaml
sources_dir: configs/sources

# Ingestion order matters: masters before facts (FK checks).
ingest_order:
  - external_geo
  - pharmacy_master
  - product_master
  - depot_master
  - pharmacy_depot
  - coverage_register
  - movement_mutabakat
  - movement_vendor
  - sellin
  - depot_stock
  - visits
  - orders
  - commercial_terms

model:
  holdout_city: "21"            # Diyarbakir - never used for tuning
  validation_origins: ["2025-09", "2025-12", "2026-03"]
  test_origin: "2026-06"        # locked final test (last matured 3-month window)
  min_train_origin: "2022-01"   # needs 12 months lookback
  # Training rows are quarterly origins: each needs its own as-of canonical build, which is cached.
  train_origin_step_months: 3
  gbm:
    learning_rate: 0.05
    num_leaves_grid: [15, 31]
    min_data_in_leaf: 40
    feature_fraction: 0.85
    bagging_fraction: 0.85
    bagging_freq: 1
    lambda_l2: 1.0
    max_rounds: 600
    early_stopping_rounds: 40
    quantiles: [0.1, 0.5, 0.9]
    # Used instead of the grid while G2 is not accepted on real data (no validation-based selection; ).
    untuned: {num_leaves: 15, rounds: 200}
  holt_winters_grid:
    alpha: [0.2, 0.4]
    beta: [0.0, 0.05]
    gamma: [0.1, 0.3]

# Track B composite weights (percentile components, sum to 1).
# v002: readiness/continuity is NOT a score component (readiness is a separate column).
score_weights_version: v002
score_weights:
  b_composite: {peer_gap: 0.7, external: 0.3}
  b_hybrid: {peer_gap: 0.45, ml_growth: 0.35, external: 0.2}
